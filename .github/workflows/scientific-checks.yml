name: Scientific checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python tools/audit_repository.py
      - run: python -m stochastic_photons --histories 4 --photons 1000
      - run: python tools/check_demo_notebook.py
      - run: python -m stochastic_photons.studies --quick
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript tests/test_r.R
      - run: Rscript scripts/run_r_demo.R
      - uses: actions/upload-artifact@v4
        with:
          name: r-demo
          path: output/r/
